          nullable: true
    OrderItem:
      type: object
      properties:
        id:
          type: string
        itemType:
          type: string
          enum: [PRODUCT, SERVICE]
        productId:
          type: string
          nullable: true
        serviceId:
          type: string
          nullable: true
        quantity:
          type: integer
        catalogUnitPrice:
          type: number
        actualUnitPrice:
          type: number
        lineTotal:
          type: number
        itemName:
          type: string
        commissionType:
          type: string
        commissionValue:
          type: number
        commissionAmount:
          type: number
        overrideReason:
          type: string
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
          nullable: true
        customerName:
          type: string
          nullable: true
        sellerId:
          type: string
          nullable: true
        sellerName:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, SUBMITTED, PENDING_REVIEW, APPROVED, COMPLETED, CANCELLED, REJECTED]
        subtotal:
          type: number
        total:
          type: number
        source:
          type: string
        notes:
          type: string
          nullable: true
        items:
          type: array
          items:
