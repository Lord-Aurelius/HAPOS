openapi: 3.1.0
info:
  title: HAPOS API
  version: 1.0.0
  summary: House Aurelius Point of Sale multi-tenant barbershop and salon management API
servers:
  - url: https://api.example.com
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Services
  - name: Catalog
  - name: Inventory
  - name: Orders
  - name: Sales
  - name: Attendance
  - name: Customers
  - name: Service Records
  - name: Expenses
  - name: Reports
  - name: SMS
  - name: Subscriptions
  - name: Super Admin
  - name: AI
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with business slug, username, and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user context
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Revenue, commissions, expenses, and profit summary
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - in: query
          name: month
          schema:
            type: string
            format: date
          description: Any date within the target month
      responses:
        '200':
          description: Dashboard totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /v1/services:
    get:
      tags: [Services]
      summary: List tenant services
      responses:
        '200':
          description: Active and inactive services
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
    post:
      tags: [Services]
      summary: Create a service in the price list
      description: Accessible to `shop_admin` and `super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/products:
    get:
      tags: [Services]
      summary: List tenant products used in service costing
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
    post:
      tags: [Services]
      summary: Create a product for usage-cost tracking
      description: Accessible to `shop_admin` and `super_admin`. Accepts full catalog fields (sku, sellingPrice, openingQuantity, reorderLevel, criticalLevel); opening stock is recorded as an OPENING_BALANCE movement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/services/{serviceId}:
    patch:
      tags: [Services]
      summary: Update a service
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    delete:
      tags: [Services]
      summary: Deactivate or remove a service
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '204':
          description: Service removed
  /v1/customers:
    get:
      tags: [Customers]
      summary: Search customers
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Name or phone search
      responses:
        '200':
          description: Matching customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
    post:
      tags: [Customers]
      summary: Create a customer
      description: Accessible to all shop roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /v1/customers/{customerId}:
    get:
      tags: [Customers]
      summary: Get a customer profile
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
    patch:
      tags: [Customers]
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /v1/customers/{customerId}/history:
    get:
      tags: [Customers]
      summary: Get visit history for one customer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer visit history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRecord'
  /v1/service-records:
    get:
      tags: [Service Records]
      summary: List service records
      description: Staff should only see their own records; admins can see all tenant records.
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: staffId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service record list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRecord'
    post:
      tags: [Service Records]
      summary: Record a completed service
      description: Accessible to all shop roles and should complete fast enough for counter use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRecordInput'
      responses:
        '201':
          description: Service record created and thank-you SMS queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
  /v1/service-records/{recordId}:
    get:
      tags: [Service Records]
      summary: Get one service record
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Service record detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
    patch:
      tags: [Service Records]
      summary: Correct a recorded service
      description: Accessible to `shop_admin` and `super_admin`. Corrections must refresh reports, customer history, and commission totals.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRecordInput'
      responses:
        '200':
          description: Service record corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
    delete:
      tags: [Service Records]
      summary: Void a service record
      description: Accessible to `shop_admin` and `super_admin`. Soft-voids the record and cascades to any co-written commerce sale (with stock reversal).
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Record voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordId:
                    type: string
                  nextRecordId:
                    type: string
                    nullable: true
                  restoredOrderId:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/expenses:
    get:
      tags: [Expenses]
      summary: List expenses
      description: Accessible to `shop_admin` and `super_admin`.
      responses:
        '200':
          description: Expense list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'
    post:
      tags: [Expenses]
      summary: Create an expense
      description: Accessible to `shop_admin` and `super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
  /v1/expenses/{expenseId}:
    patch:
      tags: [Expenses]
      summary: Update an expense
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    delete:
      tags: [Expenses]
      summary: Delete an expense
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '204':
          description: Expense deleted
  /v1/commission-payouts:
    get:
      tags: [Reports]
      summary: List commission payouts
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - in: query
          name: month
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Commission payout list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionPayout'
    post:
      tags: [Reports]
      summary: Record a commission payout
      description: Accessible to `shop_admin` and `super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPayoutInput'
      responses:
        '201':
          description: Commission payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPayout'
  /v1/reports/commissions/monthly:
    get:
      tags: [Reports]
      summary: Monthly commission report by staff
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Monthly commission rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionRow'
  /v1/reports/financials:
    get:
      tags: [Reports]
      summary: Daily or monthly financial report
      description: Accessible to `shop_admin` and `super_admin`.
      parameters:
        - in: query
          name: granularity
          schema:
            type: string
            enum: [daily, monthly]
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Financial report rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancialRow'
  /v1/reports/export:
    get:
      tags: [Reports]
      summary: Export ledger data as JSON or CSV
      description: Accessible to `shop_admin` and `super_admin`. `scope=platform` additionally requires `super_admin`.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
        - in: query
          name: scope
          schema:
            type: string
            enum: [tenant, platform]
      responses:
        '200':
          description: Export payload
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sms/promotions:
    post:
      tags: [SMS]
      summary: Queue a promotional SMS campaign
      description: Accessible to `shop_admin` and `super_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsPromotionRequest'
      responses:
        '202':
          description: Promotion campaign queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queuedRecipients:
                    type: integer
  /v1/subscriptions/current:
    get:
      tags: [Subscriptions]
      summary: Get the current subscription for the tenant
      description: Accessible to `shop_admin` and `super_admin`.
      responses:
        '200':
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
  /v1/admin/tenants:
    get:
      tags: [Super Admin]
      summary: List all tenants
      description: Accessible to `super_admin` only.
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
    post:
      tags: [Super Admin]
      summary: Create a tenant
      description: Accessible to `super_admin` only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /v1/admin/tenants/{tenantId}/suspend:
    post:
      tags: [Super Admin]
      summary: Suspend a tenant
      description: Accessible to `super_admin` only.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Tenant suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out the current session
      responses:
        '302':
          description: Redirect to the login page
  /v1/assets/{assetId}:
    get:
      tags: [Services]
      summary: Fetch an uploaded image asset
      security: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary image bytes
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/catalog:
    get:
      tags: [Catalog]
      summary: Unified sellable catalog (products + services)
      description: Accessible to `shop_admin`, `staff` and `super_admin`. Inactive items are excluded; unpriced products expose a null catalog price.
      responses:
        '200':
          description: Catalog items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
  /v1/products/{productId}:
    patch:
      tags: [Catalog]
      summary: Edit a product catalog entry
      description: Accessible to `shop_admin` and `super_admin`. Quantity is never editable here — use inventory adjustments.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/inventory/movements:
    get:
      tags: [Inventory]
      summary: List inventory movements
      description: Accessible to `shop_admin` and `super_admin`. Optional `productId` query narrows to one product.
      responses:
        '200':
          description: Movement history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryMovement'
    post:
      tags: [Inventory]
      summary: Record a stock movement
      description: Accessible to `shop_admin` and `super_admin`. Quantities are positive magnitudes; the server applies the sign. `SALE`, `SERVICE_CONSUMPTION` and `MIGRATED_USAGE` are rejected (sale engine / migration only). `ADJUSTMENT` takes `countedQuantity` plus a mandatory reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, type]
              properties:
                productId:
                  type: string
                type:
                  type: string
                  enum: [OPENING_BALANCE, PURCHASE, RETURN, TRANSFER_IN, DAMAGE, LOSS, TRANSFER_OUT, ADJUSTMENT]
                quantity:
                  type: integer
                countedQuantity:
                  type: integer
                reason:
                  type: string
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/services/{serviceId}/consumption:
    get:
      tags: [Services]
      summary: Read a service consumption definition (BOM)
      description: Accessible to `shop_admin` and `super_admin`. A definition only — it moves no stock.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Consumption lines
    put:
      tags: [Services]
      summary: Replace a service consumption definition
      description: Accessible to `shop_admin` and `super_admin`. Body `{ lines: [{ productId, quantity }] }`. Moves no stock.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: Consumption definition saved
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/orders:
    get:
      tags: [Orders]
      summary: List commerce orders
      description: Admins see the merchant queue; `staff` sees only their own orders. Tenant-scoped server-side.
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Create and submit an order
      description: Accessible to `shop_admin`, `staff` and `super_admin`. Totals are recomputed server-side (`clientTotal` mismatch is rejected). Staff downward overrides route to review. Auto-approved orders finalize their sale atomically in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                customerId:
                  type: string
                  nullable: true
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartLine'
                clientTotal:
                  type: number
                  nullable: true
                notes:
                  type: string
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: Order created (and possibly finalized)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  sale:
                    $ref: '#/components/schemas/Sale'
                  route:
                    type: string
                    enum: [PENDING_REVIEW, AUTO_APPROVE]
                  duplicate:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Read one order with items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/submit:
    post:
      tags: [Orders]
      summary: Submit a draft order
      description: Moves `DRAFT → SUBMITTED`, then routes to review or auto-approval per merchant policy.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Submission route applied
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/orders/{orderId}/approve:
    post:
      tags: [Orders]
      summary: Approve an order and finalize its sale
      description: Admin-only via domain enforcement (`staff` receives 403 for pending orders). Exactly one sale per order; re-approval returns the original. Stock posts atomically; insufficient stock blocks with nothing deducted.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order approved and sale finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  sale:
                    $ref: '#/components/schemas/Sale'
                  duplicate:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orders/{orderId}/reject:
    post:
      tags: [Orders]
      summary: Reject a pending order
      description: Admin-only via domain enforcement.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Order rejected
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an open order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/sales:
    get:
      tags: [Sales]
      summary: List commerce sales
      description: Admins see the merchant ledger; `staff` sees only their own sales.
      responses:
        '200':
          description: Sale list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
  /v1/sales/{saleId}:
    get:
      tags: [Sales]
      summary: Read one sale with items
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Sale detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sales/{saleId}/void:
    post:
      tags: [Sales]
      summary: Void a completed sale
      description: Admin-only via domain enforcement. Reverses stock (`RETURN` for products, audited `ADJUSTMENT` for consumed components) and cascades to co-written legacy rows.
      parameters:
        - $ref: '#/components/parameters/SaleId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Sale voided
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/attendance/terminal:
    get:
      tags: [Attendance]
      summary: Resolve a public attendance terminal
      security: []
      description: Returns the shop display name for a terminal reference. No auth; the reference itself is the unguessable bearer.
      parameters:
        - in: query
          name: reference
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Terminal context
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  tenantName:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Terminal revoked
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check an employee in
      security: []
      description: Public terminal operation. Requires terminal `reference` + `token` bearer and employee number. Timestamps are server-authoritative; duplicate check-ins converge safely. Throttled per terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, token, employeeNumber]
              properties:
                reference:
                  type: string
                token:
                  type: string
                employeeNumber:
                  type: string
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Terminal revoked
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check an employee out
      security: []
      description: Public terminal operation. Requires an open record; otherwise rejected without creating one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, token, employeeNumber]
              properties:
                reference:
                  type: string
                token:
                  type: string
                employeeNumber:
                  type: string
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/attendance/me:
    get:
      tags: [Attendance]
      summary: Read the caller's own attendance
      description: Employees see only their own records (server-side filter, never a client parameter).
      responses:
        '200':
          description: Own attendance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttendanceRecord'
  /v1/attendance/records:
    get:
      tags: [Attendance]
      summary: Read merchant attendance (admin)
      description: Accessible to `shop_admin` and `super_admin`. Optional `date`, `employeeId`, `status` filters.
      responses:
        '200':
          description: Attendance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttendanceRecord'
  /v1/attendance/terminals:
    get:
      tags: [Attendance]
      summary: List merchant attendance terminals
      description: Accessible to `shop_admin` and `super_admin`. Never exposes token hashes.
      responses:
        '200':
          description: Terminal list
    post:
      tags: [Attendance]
      summary: Rotate the merchant terminal credential
      description: Accessible to `shop_admin` and `super_admin`. Returns a one-time bearer for QR rendering; the previous QR stops working immediately.
      responses:
        '201':
          description: Terminal rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  token:
                    type: string
    patch:
      tags: [Attendance]
      summary: Activate or revoke the merchant terminal
      description: Accessible to `shop_admin` and `super_admin`. Body `{ isActive: boolean }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Terminal status updated
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/admin/tenants/{tenantId}/booking-qr:
    get:
      tags: [Super Admin]
      summary: Render the customer booking QR
      description: Accessible to `shop_admin` (own tenant) and `super_admin`. PNG/SVG via `format`; `download=1` attaches.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: QR image
  /v1/admin/tenants/{tenantId}/attendance-qr:
    get:
      tags: [Super Admin]
      summary: Render the attendance terminal QR
      description: Accessible to `shop_admin` (own tenant) and `super_admin`. Requires the one-time `token` from rotation plus `reference`; never interchangeable with the booking QR.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: reference
          required: true
          schema:
            type: string
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QR image
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/admin/tenants/{tenantId}/seller-qr:
    get:
      tags: [Super Admin]
      summary: Render a seller QR code
      description: Accessible to `shop_admin` (own tenant) and `super_admin`. Requires the one-time `bearer` from issuance/rotation plus `reference`. Payload resolves a transaction-only context (CREATE_ORDER + SUBMIT_ORDER); never interchangeable with attendance or booking QRs.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: reference
          required: true
          schema:
            type: string
        - in: query
          name: bearer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QR image
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/ai/chat:
    post:
      tags: [AI]
      summary: Conversational business intelligence
      description: Any authenticated session. Read-only tools; never gates POS writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Agent response
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/ai/dashboard:
    post:
      tags: [AI]
      summary: AI dashboard payload
      responses:
        '200':
          description: Dashboard payload
  /v1/ai/forecast:
    post:
      tags: [AI]
      summary: Demand/expense forecasting
      responses:
        '200':
          description: Forecast payload
  /v1/ai/insights:
    post:
      tags: [AI]
      summary: Generated business insights
      responses:
        '200':
          description: Insight list
  /v1/ai/opportunities:
    post:
      tags: [AI]
      summary: Detected opportunities
      responses:
        '200':
          description: Opportunity list
  /v1/ai/risks:
    post:
      tags: [AI]
      summary: Detected risks
      responses:
        '200':
          description: Risk list
  /v1/ai/health:
    get:
      tags: [AI]
      summary: AI provider health
      responses:
        '200':
          description: Health payload
  /v1/ai/providers:
    get:
      tags: [AI]
      summary: Configured AI providers
      responses:
        '200':
          description: Provider list
  /v1/ai/tools:
    get:
      tags: [AI]
      summary: Registered AI tool catalog
      responses:
        '200':
          description: Tool catalog
    post:
      tags: [AI]
      summary: Execute an AI tool call
      responses:
        '200':
          description: Tool result
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hapos_session
      description: Opaque session cookie issued by POST /v1/auth/login. Public terminal endpoints use their own bearer instead.
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      in: path
      name: serviceId
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      in: path
      name: customerId
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      in: path
      name: expenseId
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      in: path
      name: recordId
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      in: path
      name: saleId
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      in: path
      name: assetId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found in this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    LoginRequest:
      type: object
      required: [businessSlug, username, password]
      properties:
        businessSlug:
          type: string
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
    MeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        tenant:
          $ref: '#/components/schemas/Tenant'
        subscriptionActive:
          type: boolean
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          nullable: true
        fullName:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, shop_admin, staff]
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        ownerName:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        motto:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        storeNumber:
          type: string
          nullable: true
        timezone:
          type: string
        currencyCode:
          type: string
        status:
          type: string
          enum: [active, suspended, inactive]
    TenantInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        ownerName:
          type: string
        logoUrl:
          type: string
        motto:
          type: string
        address:
          type: string
        storeNumber:
          type: string
        timezone:
          type: string
        currencyCode:
          type: string
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        commissionType:
          type: string
          enum: [fixed, percentage]
        commissionValue:
          type: number
        isActive:
          type: boolean
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unitCost:
          type: number
          description: Acquisition cost basis (never renamed).
        sellingPrice:
          type: number
          nullable: true
          description: Null means needs_pricing.
        sku:
          type: string
          nullable: true
        skuGenerated:
          type: boolean
        quantityOnHand:
          type: integer
          description: Maintained balance; 0 on legacy rows means uncounted, never inferred.
        reorderLevel:
          type: integer
          nullable: true
        criticalLevel:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
    ProductInput:
      type: object
      required: [name, unitCost]
      properties:
        name:
          type: string
        unitCost:
          type: number
        description:
          type: string
        sku:
          type: string
          description: Optional; unique per tenant when present.
        sellingPrice:
          type: number
          description: Optional; blank means needs_pricing.
        openingQuantity:
          type: integer
          description: Recorded as an OPENING_BALANCE movement, never a bare assignment.
        reorderLevel:
          type: integer
        criticalLevel:
          type: integer
        isActive:
          type: boolean
    ServiceInput:
      type: object
      required: [name, price, commissionType, commissionValue]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        commissionType:
          type: string
          enum: [fixed, percentage]
        commissionValue:
          type: number
        durationMinutes:
          type: integer
        isActive:
          type: boolean
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        phoneE164:
          type: string
        marketingOptIn:
          type: boolean
    CustomerInput:
      type: object
      required: [name, phoneE164]
      properties:
        name:
          type: string
        phone:
          type: string
        phoneE164:
          type: string
        notes:
          type: string
        marketingOptIn:
          type: boolean
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            totalVisits:
              type: integer
            lastVisitAt:
              type: string
              format: date-time
              nullable: true
            lifetimeValue:
              type: number
    ServiceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
          nullable: true
        serviceName:
          type: string
        isCustomService:
          type: boolean
        price:
          type: number
        description:
          type: string
          nullable: true
        commission:
          type: number
        correctedAt:
          type: string
          format: date-time
          nullable: true
        correctedBy:
          type: string
          format: uuid
          nullable: true
        correctedByName:
          type: string
          nullable: true
        productUsages:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              productName:
                type: string
              quantity:
                type: integer
              unitCost:
                type: number
              totalCost:
                type: number
        performedAt:
          type: string
          format: date-time
    ServiceRecordInput:
      type: object
      required: [staffId]
      properties:
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        customerPhone:
          type: string
        staffId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
          nullable: true
        serviceMode:
          type: string
          enum: [price-list, custom]
        serviceName:
          type: string
        customServiceName:
          type: string
        price:
          type: number
        customPrice:
          type: number
        description:
          type: string
        productId:
          type: string
          format: uuid
          nullable: true
        productQuantity:
          type: integer
        performedAt:
          type: string
          format: date-time
    Expense:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: number
        expenseDate:
          type: string
          format: date
    ExpenseInput:
      type: object
      required: [category, amount, expenseDate]
      properties:
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        expenseDate:
          type: string
          format: date
    CommissionRow:
      type: object
      properties:
        staffId:
          type: string
          format: uuid
        staffName:
          type: string
        totalServices:
          type: integer
        totalRevenue:
          type: number
        totalCommission:
          type: number
    CommissionPayout:
      type: object
      properties:
        id:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        amount:
          type: number
        paidAt:
          type: string
          format: date-time
          nullable: true
        reference:
          type: string
          nullable: true
    CommissionPayoutInput:
      type: object
      required: [staffId, periodStart, periodEnd, amount]
      properties:
        staffId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        amount:
          type: number
        paidAt:
          type: string
          format: date-time
        reference:
          type: string
        notes:
          type: string
    FinancialRow:
      type: object
      properties:
        period:
          type: string
        income:
          type: number
        expenses:
          type: number
        commissionsPaid:
          type: number
        productCosts:
          type: number
        netProfit:
          type: number
    DashboardSummary:
      type: object
      properties:
        todayRevenue:
          type: number
        monthRevenue:
          type: number
        monthExpenses:
          type: number
        monthCommissionAccrued:
          type: number
        monthCommissionPaid:
          type: number
        monthProductCosts:
          type: number
        monthNetProfit:
          type: number
        topStaff:
          type: array
          items:
            $ref: '#/components/schemas/CommissionRow'
        recentServices:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRecord'
    SmsPromotionRequest:
